# Containerlab topology: 1 spine, 2 leaves, point-to-point links.
# Deploy:  sudo containerlab deploy -t topology.clab.yml
# Destroy: sudo containerlab destroy -t topology.clab.yml
name: netlab

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest   # pin a version for reproducibility
  nodes:
    spine1:
      kind: nokia_srlinux
    leaf1:
      kind: nokia_srlinux
    leaf2:
      kind: nokia_srlinux
  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
